server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pushpal}
    username: ${DB_USERNAME:pushpal}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:${SMTP_USERNAME:}}
    password: ${SMTP_PASS:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            checkserveridentity: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-days: 7
  delivery-token:
    expiration-hours: 24
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:pushpal@example.com}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    userinfo-uri: https://www.googleapis.com/oauth2/v2/userinfo
  magic-link:
    expiration-minutes: 15
    base-url: ${MAGIC_LINK_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:${SMTP_USER:PushPal <noreply@pushpal.app>}}
  api-base-url: ${API_BASE_URL:}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  scheduler:
    enabled: true
    interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
