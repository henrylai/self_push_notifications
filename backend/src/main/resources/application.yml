server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pushpal}
    username: ${DB_USERNAME:pushpal}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-at-least-256-bits-long!!}
    expiration-days: 7
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:pushpal@example.com}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  magic-link:
    secret: ${MAGIC_LINK_SECRET:dev-magic-link-secret}
    expiration-minutes: 15
  scheduler:
    enabled: true
    interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
